<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentShop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #1f2833;
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #66fcf1;
            text-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }

        p {
            font-size: 1.1rem;
            color: #8892b0;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Вітаємо у <span>VentShop</span>!</h1>
        <p>Сайт успішно запущено на серверах Render.com в режимі 24/7!</p>
    </div>

</body>
</html>
